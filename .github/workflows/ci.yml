name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: python -m pytest tests -q

  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_utf8.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for api on :8000
        run: timeout 60 bash -c 'until curl -fs http://localhost:8000/healthz; do sleep 2; done'

      - name: Verify all five services are up and none are restarting
        run: |
          docker compose ps
          running=$(docker compose ps --status running -q | wc -l)
          if [ "$running" -ne 5 ]; then
            echo "::error::expected 5 running services, found $running"
            exit 1
          fi
          for c in $(docker compose ps -a -q); do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$c")
            if [ "$restarts" -gt 0 ]; then
              echo "::error::$(docker inspect -f '{{.Name}}' "$c") restarted $restarts times"
              exit 1
            fi
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
