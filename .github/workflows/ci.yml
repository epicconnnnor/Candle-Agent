name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: python -m pytest tests -q

  encoding-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check_utf8.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for api on :8000
        run: timeout 60 bash -c 'until curl -fs http://localhost:8000/healthz; do sleep 2; done'

      - name: Verify every service is up and none are restarting
        run: |
          docker compose ps
          # Expected set comes from the compose file, never a literal.
          # A hardcoded count is how the replay service broke this job:
          # it was added to docker-compose.yml and the number here was
          # not, so CI failed on an off-by-one rather than on anything
          # real. Adding a service should need no edit in this file.
          expected=$(docker compose config --services | sort)
          running=$(docker compose ps --services --status running | sort)
          missing=$(comm -23 <(echo "$expected") <(echo "$running"))
          if [ -n "$missing" ]; then
            # Name them, and show why. A bare count mismatch says a
            # service is down but not which, and costs a round trip.
            echo "::error::not running: $(echo "$missing" | tr '\n' ' ')"
            while read -r s; do
              echo "--- $s ---"
              docker compose ps -a "$s"
              docker compose logs --tail=50 "$s"
            done <<< "$missing"
            exit 1
          fi
          for c in $(docker compose ps -a -q); do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$c")
            if [ "$restarts" -gt 0 ]; then
              name=$(docker inspect -f '{{.Name}}' "$c")
              echo "::error::$name restarted $restarts times"
              docker logs --tail=50 "$c"
              exit 1
            fi
          done
          echo "all $(echo "$expected" | wc -l) services running, no restarts"

      - name: Tear down
        if: always()
        run: docker compose down -v
