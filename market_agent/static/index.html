<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>market-agent</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d;
    --text: #d4d4c8; --muted: #7d8590;
    --bull: #2f9e6e; --bear: #d85a4a; --accent: #e8b04a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.08em; }
  header h1::before { content: "▮ "; color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
  main { display: flex; flex: 1; min-height: 0; }
  #chart { flex: 1; min-width: 0; }
  aside {
    width: 320px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 16px; overflow-y: auto; font-size: 13px; line-height: 1.6;
  }
  aside h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .decision { font-size: 18px; letter-spacing: 0.04em; }
  .decision.long { color: var(--bull); }
  .decision.short { color: var(--bear); }
  .decision.flat { color: var(--muted); }
  .kv { display: flex; justify-content: space-between; padding: 2px 0; }
  .kv span:first-child { color: var(--muted); }
  ol { padding-left: 18px; color: var(--text); }
  ol li { margin: 4px 0; }
  button {
    width: 100%; margin-top: 16px; padding: 10px; cursor: pointer;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 4px;
    font: inherit; letter-spacing: 0.06em;
  }
  button:hover { background: rgba(232,176,74,0.1); }
  button:disabled { opacity: 0.4; cursor: wait; }
  .empty { color: var(--muted); }
  @media (max-width: 760px) { main { flex-direction: column; } aside { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>market-agent</h1>
  <span id="symbol">BTCUSDT</span>
  <span id="status">loading…</span>
</header>
<main>
  <div id="chart"></div>
  <aside>
    <h2>Decision</h2>
    <div id="decision" class="decision flat">—</div>
    <div id="levels"></div>
    <h2>Diagnosis</h2>
    <div id="diagnosis" class="empty">No analysis yet.</div>
    <h2>Reasoning</h2>
    <ol id="reasoning"></ol>
    <h2>Paper Trading</h2>
    <div id="paper" class="empty">No trades yet.</div>
    <h2>Meta</h2>
    <div id="meta"></div>
    <button id="run" onclick="runAnalysis()">Run analysis</button>
  </aside>
</main>
<script>
const SYMBOL = new URLSearchParams(location.search).get("symbol") || "BTCUSDT";
document.getElementById("symbol").textContent = SYMBOL;

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  layout: { background: { color: "#0d1117" }, textColor: "#7d8590" },
  grid: { vertLines: { color: "#161b22" }, horzLines: { color: "#161b22" } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#21262d" },
  rightPriceScale: { borderColor: "#21262d" },
});
const candles = chart.addCandlestickSeries({
  upColor: "#2f9e6e", downColor: "#d85a4a",
  wickUpColor: "#2f9e6e", wickDownColor: "#d85a4a", borderVisible: false,
});
let priceLines = [];

async function loadBars() {
  const r = await fetch(`/api/bars/${SYMBOL}?limit=200`);
  const bars = await r.json();
  candles.setData(bars.map(b => ({
    time: Math.floor(b.ts / 1000), open: b.open, high: b.high, low: b.low, close: b.close,
  })));
  document.getElementById("status").textContent = `${bars.length} bars`;
  chart.timeScale().fitContent();
}

function drawLevels(s2) {
  priceLines.forEach(l => candles.removePriceLine(l));
  priceLines = [];
  if (!s2 || s2.decision === "no_trade") return;
  const mk = (price, color, title) => candles.createPriceLine({
    price, color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title,
  });
  if (s2.entry != null) priceLines.push(mk(s2.entry, "#e8b04a", "entry"));
  if (s2.stop != null) priceLines.push(mk(s2.stop, "#d85a4a", "stop"));
  if (s2.target != null) priceLines.push(mk(s2.target, "#2f9e6e", "target"));
}

function renderAnalysis(a) {
  const s1 = a.stage1, s2 = a.stage2;
  const el = document.getElementById("decision");
  const isLong = /buy/.test(s2.decision), isFlat = s2.decision === "no_trade";
  el.textContent = s2.decision.replace("_", " ").toUpperCase();
  el.className = "decision " + (isFlat ? "flat" : isLong ? "long" : "short");
  document.getElementById("levels").innerHTML = isFlat ? "" : `
    <div class="kv"><span>entry</span><span>${s2.entry}</span></div>
    <div class="kv"><span>stop</span><span>${s2.stop}</span></div>
    <div class="kv"><span>target</span><span>${s2.target}</span></div>
    <div class="kv"><span>R:R</span><span>${s2.risk_reward ?? "—"}</span></div>
    <div class="kv"><span>confidence</span><span>${s2.confidence}</span></div>`;
  document.getElementById("diagnosis").innerHTML =
    `<div class="kv"><span>regime</span><span>${s1.regime}</span></div>
     <div class="kv"><span>strength</span><span>${s1.strength}</span></div>
     <div style="margin-top:6px">${s1.summary}</div>`;
  document.getElementById("reasoning").innerHTML =
    s2.reasoning_chain.map(x => `<li>${x}</li>`).join("");
  document.getElementById("meta").innerHTML =
    `<div class="kv"><span>model</span><span>${a.model}</span></div>
     <div class="kv"><span>latency</span><span>${a.latency_ms} ms</span></div>`;
  drawLevels(s2);
}

function renderPaper(p) {
  const el = document.getElementById("paper");
  const a = p.active, s = p.summary || {};
  let html = "";
  if (a) {
    const cls = a.direction === "long" ? "long" : "short";
    html += `<div class="kv"><span>position</span><span class="${cls}">${a.status} ${a.direction}</span></div>
      <div class="kv"><span>entry</span><span>${a.entry}</span></div>
      <div class="kv"><span>stop / target</span><span>${a.stop} / ${a.target}</span></div>`;
  } else {
    html += `<div class="kv"><span>position</span><span>flat</span></div>`;
  }
  if (s.trades) {
    const pnlCls = s.total_r >= 0 ? "long" : "short";
    html += `<div class="kv"><span>closed trades</span><span>${s.trades}</span></div>
      <div class="kv"><span>win rate</span><span>${s.win_rate != null ? (s.win_rate*100).toFixed(0)+"%" : "—"}</span></div>
      <div class="kv"><span>total R</span><span class="${pnlCls}">${s.total_r}</span></div>
      <div class="kv"><span>paper P&L</span><span class="${pnlCls}">$${s.pnl_usd}</span></div>`;
  }
  el.innerHTML = html;
  el.className = "";
}

async function loadPaper() {
  const r = await fetch(`/api/paper/${SYMBOL}`);
  if (r.ok) renderPaper(await r.json());
}

async function loadAnalysis() {
  const r = await fetch(`/api/analysis/${SYMBOL}`);
  if (r.ok) renderAnalysis(await r.json());
}

async function runAnalysis() {
  // POST publishes an analysis.request on the bus and returns 202;
  // the result arrives on the SSE stream below.
  const btn = document.getElementById("run");
  btn.disabled = true; btn.textContent = "Queued…";
  await fetch(`/api/analyze/${SYMBOL}`, { method: "POST" });
}

// Live event stream: the API service fans bus events out over SSE.
const es = new EventSource("/api/events");
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  if (ev.data.symbol !== SYMBOL) return;
  if (ev.subject.startsWith("bars.closed.")) {
    const b = ev.data;
    candles.update({ time: Math.floor(b.ts / 1000),
                     open: b.open, high: b.high, low: b.low, close: b.close });
    document.getElementById("status").textContent =
      `live · last close ${b.close}`;
  } else if (ev.subject.startsWith("paper.update.")) {
    renderPaper(ev.data);
  } else if (ev.subject.startsWith("analysis.completed.")) {
    renderAnalysis(ev.data);
    const btn = document.getElementById("run");
    btn.disabled = false; btn.textContent = "Run analysis";
  }
};
es.onerror = () => { document.getElementById("status").textContent = "event stream reconnecting…"; };

loadBars().then(loadAnalysis).then(loadPaper);
</script>
</body>
</html>
